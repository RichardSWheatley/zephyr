identifier: apollo510_evb
name: Apollo510 EVB
type: mcu
arch: arm
ram: 3072
flash: 4096
toolchain:
  - zephyr
  - gnuarmemb
simulation:
  - name: renode
    exec: renode
supported:
  - uart
  - adc
  - watchdog
  - counter
  - crc
  - gpio
  - spi
  - i2c
  - i2c_target
  - rtc
  - hwinfo
  - clock_control
  - usbd
  - pdm
  - i2s
  - mspi
  - sdhc
testing:
  timeout_multiplier: 6
  ignore_tags:
    - net
    - bluetooth
  renode:
    uart: sysbus.uart0
    resc: boards/ambiq/apollo510_evb/support/apollo510_evb.resc
vendor: ambiq
