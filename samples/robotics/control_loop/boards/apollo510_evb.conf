# One kernel tick per stimer cycle: deadlines land on hardware timer
# edges and the wakeup-jitter numbers carry no tick-rounding bias.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=32768
# The board defconfig enables PM; disable it so the measured jitter is
# scheduling, not wakeup-from-sleep.
CONFIG_PM=n
CONFIG_PM_DEVICE=n
CONFIG_PM_DEVICE_RUNTIME=n
