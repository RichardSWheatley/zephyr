CONFIG_APP_TRANSPORT_UDP=y
# NSOS offloaded sockets: zero host-side setup on native_sim. Non-native
# boards need their own network configuration instead of this block.
CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
